map $request_uri $loggable { ~^/api/join/ 0; ~^/convite/ 0; default 1; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen ${PORT};
 access_log /var/log/nginx/access.log combined if=$loggable;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Referrer-Policy "no-referrer" always;
 add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
 root /usr/share/nginx/html;
 location /api/ { proxy_pass ${API_URL}; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 75s; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { try_files $uri $uri/ /index.html; }
}
