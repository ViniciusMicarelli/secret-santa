map $request_uri $loggable { ~^/api/join/ 0; ~^/convite/ 0; default 1; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen ${PORT};
 access_log /var/log/nginx/access.log combined if=$loggable;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Referrer-Policy "no-referrer" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' wss:; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
 root /usr/share/nginx/html;
 location /api/ { proxy_pass ${API_URL}; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 75s; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { try_files $uri $uri/ /index.html; }
}
